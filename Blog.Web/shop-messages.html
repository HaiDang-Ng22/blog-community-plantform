<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ trợ mua sắm - Zynk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/common.css?v=1.7">
    <link rel="stylesheet" href="css/shop-chat.css?v=1.2">
    <link rel="stylesheet" href="css/preferences.css?v=1.1">
    <script src="js/preferences.js?v=1.1"></script>
</head>
<body class="home-page commerce-chat-page" data-chat-mode="buyer">
    <script>
        if (new URLSearchParams(location.search).get('embedded') === '1') {
            document.body.classList.add('commerce-chat-embedded');
        }
    </script>
    <header class="main-header">
        <nav class="nav-container container-wide">
            <div class="logo"><a href="index.html" aria-label="Zynk"><div class="zynk-logo-clean logo-header"></div></a></div>
            <div class="nav-actions" id="nav-actions"></div>
        </nav>
    </header>

    <main class="commerce-chat-wrap main-with-sidebar">
        <div class="commerce-chat-heading">
            <div><h1>Trung tâm hỗ trợ mua sắm</h1><p>Trao đổi trực tiếp với Shop về sản phẩm, đơn hàng và khiếu nại.</p></div>
            <span class="commerce-chat-status">Kết nối an toàn</span>
        </div>
        <section class="commerce-chat-shell" id="commerce-chat-shell">
            <aside class="commerce-chat-sidebar">
                <div class="commerce-chat-sidebar-head"><strong>Tin nhắn Shop</strong><span>Tất cả cuộc trao đổi mua sắm</span></div>
                <label class="commerce-chat-search"><i class="fa-solid fa-magnifying-glass"></i><input id="commerce-chat-search" type="search" placeholder="Tìm cửa hàng…"></label>
                <div class="commerce-chat-list" id="commerce-chat-list"></div>
            </aside>
            <div class="commerce-chat-main" id="commerce-chat-main">
                <div class="commerce-chat-empty"><div><span class="commerce-chat-empty-icon"><i class="fa-solid fa-headset"></i></span><h2>Shop luôn sẵn sàng hỗ trợ</h2><p>Chọn một cuộc trò chuyện để hỏi về sản phẩm, kiểm tra đơn hàng hoặc gửi khiếu nại đến Admin.</p></div></div>
            </div>
        </section>
    </main>

    <script src="js/api.js?v=2.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="js/common.js?v=3.1"></script>
    <script src="js/shop-chat.js?v=1.2"></script>
</body>
</html>
