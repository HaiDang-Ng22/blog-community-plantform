<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chăm sóc khách hàng - Zynk Seller</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="seller-common.css?v=3.1">
    <link rel="stylesheet" href="../css/shop-chat.css?v=1.1">
    <link rel="stylesheet" href="../css/preferences.css?v=1.1">
    <script src="../js/preferences.js?v=1.1"></script>
</head>
<body class="commerce-chat-page" data-chat-mode="seller">
    <main class="seller-main">
        <div class="commerce-chat-wrap">
            <div class="commerce-chat-heading">
                <div><h1>Chăm sóc khách hàng</h1><p>Tư vấn sản phẩm, hỗ trợ đơn hàng và xây dựng trải nghiệm mua sắm tốt hơn.</p></div>
                <span class="commerce-chat-status">Seller đang trực tuyến</span>
            </div>
            <section class="commerce-chat-shell" id="commerce-chat-shell">
                <aside class="commerce-chat-sidebar">
                    <div class="commerce-chat-sidebar-head"><strong>Khách hàng gần đây</strong><span>Ưu tiên hội thoại chưa đọc</span></div>
                    <label class="commerce-chat-search"><i class="fa-solid fa-magnifying-glass"></i><input id="commerce-chat-search" type="search" placeholder="Tìm khách hàng…"></label>
                    <div class="commerce-chat-list" id="commerce-chat-list"></div>
                </aside>
                <div class="commerce-chat-main" id="commerce-chat-main">
                    <div class="commerce-chat-empty"><div><span class="commerce-chat-empty-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></span><h2>Biến trò chuyện thành đơn hàng</h2><p>Chọn khách hàng để tư vấn, gửi sản phẩm phù hợp hoặc hỗ trợ tình trạng đơn hàng.</p></div></div>
                </div>
            </section>
        </div>
    </main>

    <script src="../js/api.js?v=2.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="seller-common.js?v=3.1"></script>
    <script src="../js/shop-chat.js?v=1.1"></script>
</body>
</html>
