<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=admin/index.html">
    <title>Đang mở Zynk Admin...</title>
    <link rel="icon" href="assets/favicon.png?v=2" type="image/png">
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #172033; background: #f4f6fb; font: 600 15px Inter, system-ui, sans-serif; }
        .loader { display: flex; align-items: center; gap: 12px; }
        .loader::before { width: 22px; height: 22px; border: 3px solid #ddd9ff; border-top-color: #6d5dfc; border-radius: 50%; content: ""; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">Đang mở trung tâm quản trị...</div>
    <script>window.location.replace('admin/index.html');</script>
</body>
</html>
