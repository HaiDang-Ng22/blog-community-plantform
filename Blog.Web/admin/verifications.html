<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duyệt tích xanh - Admin</title>
    <link rel="icon" href="../assets/favicon.png?v=3" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin-common.css?v=4.0">
    <link rel="stylesheet" href="/css/preferences.css?v=1.1">
    <script src="/js/preferences.js?v=1.1"></script>
</head>
<body>
    <main class="admin-main">
        <header class="page-header">
            <div class="page-title">
                <h1>Duyệt tích xanh (Database)</h1>
                <p>Yêu cầu từ database thật, không phải LocalStorage.</p>
            </div>
            <button class="btn btn-secondary" onclick="loadData()">
                <i class="fa-solid fa-rotate"></i> Tải lại
            </button>
        </header>

        <div class="card">
            <div class="data-table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Người dùng</th>
                            <th>Họ tên</th>
                            <th>Loại</th>
                            <th>Ảnh</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="v-list">
                        <tr><td colspan="5" style="text-align:center; padding:30px;">Đang tải...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../js/api.js?v=2.1"></script>
    <script src="admin-common.js?v=4.1"></script>
    <script>
        let pendingVerificationRequests = [];

        async function loadData() {
            const list = document.getElementById('v-list');
            try {
                const data = await window.adminApi.get('admin/verifications');
                const pending = data.filter(x => x.status === 'Pending');
                pendingVerificationRequests = pending;
                
                if (pending.length === 0) {
                    list.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px;">Hiện không có yêu cầu nào mới.</td></tr>';
                    return;
                }

                list.innerHTML = pending.map(req => `
                    <tr>
                        <td><b>@${window.adminEscapeHtml(req.username)}</b></td>
                        <td>${window.adminEscapeHtml(req.fullName)}</td>
                        <td><span class="badge badge-warning">${window.adminEscapeHtml(req.documentType)}</span></td>
                        <td>
                            <button class="btn btn-secondary" onclick="viewDocument('${req.id}')">Xem ảnh</button>
                        </td>
                        <td>
                            <button class="btn btn-primary" onclick="action('${req.id}', 'approve')">Duyệt</button>
                            <button class="btn btn-danger" onclick="action('${req.id}', 'reject')">Từ chối</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Lỗi tải dữ liệu Admin:', err);
                list.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red; padding:30px;">Lỗi: ${err.message}</td></tr>`;
            }
        }

        function viewDocument(id) {
            const request = pendingVerificationRequests.find(item => item.id === id);
            if (!request) return;
            const url = window.adminSafeUrl(request.documentUrl);
            if (!url) {
                window.adminToast('Đường dẫn tài liệu không hợp lệ.', 'error');
                return;
            }
            window.adminModal.open(`<img src="${url}" alt="Tài liệu xác minh" style="display:block; width:100%; max-height:72vh; object-fit:contain; border-radius:14px;">`);
        }

        async function action(id, type) {
            try {
                await window.adminApi.post(`admin/verifications/${id}/${type}`, {});
                window.adminToast(type === 'approve' ? 'Đã duyệt yêu cầu tích xanh.' : 'Đã từ chối yêu cầu.', 'success');
                loadData();
            } catch (err) {
                window.adminToast(err.message || 'Không thể xử lý yêu cầu', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
