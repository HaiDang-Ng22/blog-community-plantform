name: Build and Test

on:
  push:
    branches: [main, master, develop, "codex/**"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: .NET and frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore dependencies
        run: dotnet restore BlogSystem.sln

      - name: Build solution
        run: dotnet build BlogSystem.sln --configuration Release --no-restore --warnaserror

      - name: Run automated tests
        run: dotnet test BlogSystem.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Validate frontend JavaScript syntax
        shell: bash
        run: find Blog.Web -type f -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Publish API artifact
        run: dotnet publish Blog.API/Blog.API.csproj --configuration Release --no-build --output artifacts/api

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: zynk-api
          path: artifacts/api
